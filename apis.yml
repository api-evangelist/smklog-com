aid: smklog-com
name: SMKlog
description: 'SMKlog (SMKLOG-2022 LLC, Berkeley Heights, New Jersey) is an independent US parcel shipping calculator and label
  seller: describe an item in plain words, get live USPS, UPS, FedEx and DHL Express rates from a US origin to the US, Canada,
  the UK, Germany or Australia, and buy the label online. The same pricing engine is published for machines as the SMKlog
  Quote API on quote-api.smklog.com: an OpenAPI 3.1 contract with no key required, a remote MCP server with five tools (plus
  an open-source stdio bridge), an A2A agent card, an RFC 9727 api-catalog, RFC 8414/9728 OAuth metadata for an optional client_credentials
  rate-limit tier, two provider-published Agent Skills and an llms.txt. Agents price and prepare checkout; a human always
  completes payment on smklog.com.'
image: https://smklog.com/assets/icon-512.png
url: https://smklog.com/apis.json
