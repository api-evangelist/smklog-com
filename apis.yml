  request: 'Dmitrii Timin (ceo@smklog.com), 2026-10-07: https://apis.io/a2a/smklog-com shows "Agent card, not A2A" with no-protocolVersion,
    no-top-level-url and supportedInterfaces-instead-of-preferredTransport-and-url -- 0.3 rules applied to an A2A 1.0 card
    (spec 4.4.1, 4.4.6: no top-level url/preferredTransport/protocolVersion; supportedInterfaces[] carries url, protocolBinding,
    protocolVersion). The page is built from a 2026-09-19 copy; the live card has three skills, declares 1.0 and is JWS-signed.
    Re-capture and fix the check.'
  applied: '2026-10-08'
  applied_note: 'Verified live 2026-10-08: card 200 application/json on smklog.com (same JSON on quote-api.smklog.com), version
    1.4.0, supportedInterfaces[0] {url https://quote-api.smklog.com/a2a, protocolBinding JSONRPC, protocolVersion 1.0}, 3
