apis:
- name: SMKlog Quote API
  description: 'Live parcel shipping rates and agent-prepared checkout for one parcel sent from a US origin.
    Four operations: POST /quote prices an item described in plain words (or by product URL) across USPS,
    UPS, FedEx and DHL Express, estimating the packed box when dimensions are omitted and returning up to five
    purchasable services with the checkout total, the carrier counter price and the delivery window; POST
    /agent/checkout-session creates a payment session (MPP intent "session") and a handoff URL where a human
    confirms consents and pays on Stripe hosted checkout; GET /agent/checkout-session/{session_id} reports
    whether the human paid and whether the label exists; GET /status is a liveness probe. No key is required;
    requests are rate limited per client (about 80 quotes an hour, shared with the MCP endpoint) and an
    optional OAuth 2.0 client_credentials token, issued manually, raises the bucket.'
  image: https://smklog.com/assets/icon-512.png
  humanURL: https://smklog.com/api
