description: >-
  Two published per-client hourly buckets, both stated in the provider's own contract text: about 80 quote calls an
  hour shared between POST /quote, the MCP get_parcel_quote tool, the A2A skill and (when it prices live)
  createPaymentSession / create_checkout_link; and 60 checkout-status reads an hour. track_parcel and
  get_price_index spend no quote allowance. Exhaustion answers HTTP 429 rate_limited. No rate-limit response
  headers are documented, and none were observed on the live 400/404 responses. Manually issued OAuth
  client_credentials move an agent to "its own hourly bucket at its own size" (auth.md) — the size is not published.
