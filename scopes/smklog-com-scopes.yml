description: >-
  The OpenAPI declares no securitySchemes (0-working/derive-oauth-scopes.py found nothing to derive), because the
  API is open; OAuth exists only as an optional rate-limit tier. The RFC 8414 metadata publishes one scope,
  quote, one grant (client_credentials) and two token-endpoint auth methods. Registration is manual by email;
  there is no authorization endpoint, no user identity and no dynamic client registration.
